
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>SABER GROUP Training management system</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('saber-theme');
        document.documentElement.className = savedTheme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // SABER GROUP identity: legacy primary/slate/blue/indigo/purple/violet/sky utilities across
              // older pages are remapped to the warm-black + rust/ember palette.
              slate: {
                50: '#f6f3f2', 100: '#ebe6e2', 150: '#e2dcd8', 200: '#d9d3cf', 300: '#cbc7c5',
                400: '#92939a', 500: '#77767c', 600: '#57534f', 700: '#3d3835',
                800: '#2a2624', 850: '#211e1c', 900: '#131212', 950: '#0c0b0b',
              },
              blue: {
                50: '#fff4ef', 100: '#ffe4d6', 200: '#ffc6a8', 300: '#ffa36f',
                400: '#ff8a1f', 500: '#ee4e2b', 600: '#d83b25', 700: '#b42b1b',
                800: '#8f2017', 900: '#6e1a13', 950: '#3d0e0a',
              },
              indigo: {
                50: '#fff4ef', 100: '#ffe4d6', 200: '#ffc6a8', 300: '#ffa36f',
                400: '#ff8a1f', 500: '#ee4e2b', 600: '#d83b25', 700: '#b42b1b',
                800: '#8f2017', 900: '#6e1a13', 950: '#3d0e0a',
              },
              purple: {
                50: '#fff4ef', 100: '#ffe4d6', 200: '#ffc6a8', 300: '#ffa36f',
                400: '#ff8a1f', 500: '#ee4e2b', 600: '#d83b25', 700: '#b42b1b',
                800: '#8f2017', 900: '#6e1a13', 950: '#3d0e0a',
              },
              violet: {
                50: '#fff4ef', 100: '#ffe4d6', 200: '#ffc6a8', 300: '#ffa36f',
                400: '#ff8a1f', 500: '#ee4e2b', 600: '#d83b25', 700: '#b42b1b',
                800: '#8f2017', 900: '#6e1a13', 950: '#3d0e0a',
              },
              sky: {
                50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
                400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                800: '#9a3412', 900: '#7c2d12', 950: '#431407',
              },
              primary: {
                50: '#fff4ef', 100: '#ffe4d6', 200: '#ffc6a8', 300: '#ffa36f', 350: '#ff9748',
                400: '#ff8a1f', 450: '#f66c25', 500: '#ee4e2b', 600: '#d83b25', 700: '#b42b1b',
                800: '#8f2017', 900: '#6e1a13', 950: '#3d0e0a',
              },
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '3rem',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              arabic: ['Cairo', 'sans-serif'],
              display: ['Bebas Neue', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
        :root {
          color-scheme: dark;
          background: #070707;
        }
        html.light { color-scheme: light; background: #f4f1ee; }
        html,
        body,
        #root {
          min-height: 100%;
          background: inherit;
        }
        body { 
          font-family: 'Inter', sans-serif; 
          overflow-x: hidden;
          margin: 0;
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #34302e; border-radius: 10px; }
        .light ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in {
          animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .dark input, .dark select, .dark textarea {
          background-color: #0f172a !important;
          color: #f1f5f9 !important;
          border-color: #334155 !important;
        }
        .light input, .light select, .light textarea {
          background-color: #ffffff !important;
          color: #0f172a !important;
          border-color: #e2e8f0 !important;
        }
    </style>
<link rel="stylesheet" href="/index.css">
    <link rel="manifest" href="/manifest.json" id="app-manifest">
    <link rel="icon" href="/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SG Training" id="apple-title">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
</head>
<body class="transition-colors duration-200">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
