<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:600;src:url(cairo-arabic-600-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-arabic-900-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:600;src:url(cairo-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;background:#0a0a0a;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const W=1920,H=1080;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const C={bg:'#0a0a0a',red:'#c4321f',ember:'#e85c3b',gold:'#ffb070',white:'#fff7f2'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eOutBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eIn=x=>x*x*x;
const eOut=x=>1-Math.pow(1-x,3);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const isAr=s=>/[؀-ۿ]/.test(s);

function setFont(s,size,w,ls){ctx.font=`${w} ${size}px Cairo`;ctx.direction=isAr(s)?'rtl':'ltr';ctx.letterSpacing=isAr(s)?'0px':(ls||0)+'px';}
function T(s,x,y,size,o={}){
  const {w=900,col=C.white,align='center',alpha=1,ls=0,glow=0,glowCol=C.red,base='middle'}=o;
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;setFont(s,size,w,ls);ctx.textAlign=align;ctx.textBaseline=base;
  if(glow){ctx.shadowColor=glowCol;ctx.shadowBlur=glow;}
  ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();
}
function tw(s,size,w=900,ls=0){ctx.save();setFont(s,size,w,ls);const m=ctx.measureText(s).width;ctx.restore();return m;}
// glitch text: chromatic split
function GT(s,x,y,size,o,g){
  if(g>0.02){
    const off=g*26;
    ctx.save();ctx.globalCompositeOperation='lighter';
    T(s,x-off,y+off*0.2,size,{...o,col:'rgba(255,40,40,0.8)',glow:0,alpha:(o.alpha??1)*g});
    T(s,x+off,y-off*0.2,size,{...o,col:'rgba(40,220,255,0.7)',glow:0,alpha:(o.alpha??1)*g});
    ctx.restore();
  }
  T(s,x,y,size,o);
}
function rise(s,x,y,size,o,t0,t,dur=0.5){
  const p=eOutExpo(P(t,t0,t0+dur));if(p<=0)return;
  ctx.save();ctx.beginPath();ctx.rect(0,y-size*0.95,W,size*1.9);ctx.clip();
  T(s,x,y+(1-p)*size*1.4,size,o);ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowBlob(x,y,r,col,a=1){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();}

// ---------- assets ----------
const logo=new Image();logo.src='logo.png';
// grain tiles
const grains=[];{const R=rng(7);for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);grains.push(c);}}
// particles
const R1=rng(42);
const PARTS=Array.from({length:460},()=>({a:R1()*Math.PI*2,r:380+R1()*1000,spin:1.2+R1()*2.4,s:1+R1()*2.8,c:['#ff6a3d','#c4321f','#ffb070','#ff8a4c'][Math.floor(R1()*4)],d:R1()}));
const EMB=Array.from({length:130},()=>({x:R1()*W,y:R1()*H,v:20+R1()*70,s:0.8+R1()*2.4,ph:R1()*6.28,dr:R1()*40}));

// ---------- poster (the "AI generated" artwork) ----------
const PW=560,PH=700;
const poster=document.createElement('canvas');poster.width=PW;poster.height=PH;
function buildPoster(){
  const g=poster.getContext('2d');const R=rng(99);
  let lg=g.createLinearGradient(0,0,0,PH);lg.addColorStop(0,'#2e0703');lg.addColorStop(0.6,'#140302');lg.addColorStop(1,'#060606');g.fillStyle=lg;g.fillRect(0,0,PW,PH);
  let rg=g.createRadialGradient(280,390,10,280,390,380);rg.addColorStop(0,'rgba(255,140,60,0.85)');rg.addColorStop(0.35,'rgba(196,50,31,0.55)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,PW,PH);
  g.save();g.globalCompositeOperation='lighter';g.translate(280,390);
  for(let i=0;i<18;i++){g.rotate(Math.PI*2/18);g.fillStyle=`rgba(255,160,90,${0.04+R()*0.05})`;g.beginPath();g.moveTo(0,0);g.lineTo(700,-26);g.lineTo(700,26);g.fill();}
  g.restore();
  g.strokeStyle='rgba(255,176,112,0.7)';g.lineWidth=5;g.beginPath();g.arc(280,390,205,0,Math.PI*2);g.stroke();
  g.strokeStyle='rgba(255,176,112,0.25)';g.lineWidth=2;g.beginPath();g.arc(280,390,240,0,Math.PI*2);g.stroke();
  // flames
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){const x=150+R()*260,h=120+R()*200,w=30+R()*50;const fg=g.createLinearGradient(0,620,0,620-h);fg.addColorStop(0,'rgba(255,220,120,0.55)');fg.addColorStop(0.5,'rgba(232,92,59,0.35)');fg.addColorStop(1,'rgba(196,50,31,0)');g.fillStyle=fg;g.beginPath();g.moveTo(x-w,630);g.quadraticCurveTo(x-w*0.8,630-h*0.6,x+(R()-0.5)*40,630-h);g.quadraticCurveTo(x+w*0.8,630-h*0.6,x+w,630);g.fill();}
  g.restore();
  // can
  g.save();g.translate(280,395);g.rotate(-0.2);
  const cw=86,ch=195;
  let cg=g.createLinearGradient(-cw,0,cw,0);
  cg.addColorStop(0,'#1a0403');cg.addColorStop(0.18,'#6a140b');cg.addColorStop(0.36,'#c4321f');cg.addColorStop(0.46,'#ffc2a0');cg.addColorStop(0.56,'#d8412a');cg.addColorStop(0.82,'#5a120a');cg.addColorStop(1,'#140302');
  g.fillStyle=cg;g.beginPath();g.moveTo(-cw,-ch);g.lineTo(cw,-ch);g.lineTo(cw,ch);g.ellipse(0,ch,cw,20,0,0,Math.PI);g.lineTo(-cw,-ch);g.fill();
  let tg=g.createLinearGradient(-cw,0,cw,0);tg.addColorStop(0,'#555');tg.addColorStop(0.45,'#eee');tg.addColorStop(1,'#444');
  g.fillStyle=tg;g.beginPath();g.ellipse(0,-ch,cw,20,0,0,Math.PI*2);g.fill();
  g.fillStyle='#2a2a2a';g.beginPath();g.ellipse(0,-ch,cw-12,13,0,0,Math.PI*2);g.fill();
  g.fillStyle='#bbb';g.beginPath();g.ellipse(8,-ch,22,6,0,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(-cw,-ch+40,cw*2,10);g.fillRect(-cw,ch-50,cw*2,10);
  g.save();g.rotate(-Math.PI/2);g.font='900 76px Cairo';g.textAlign='center';g.textBaseline='middle';g.letterSpacing='6px';g.fillStyle='#fff7f2';g.shadowColor='rgba(0,0,0,0.5)';g.shadowBlur=10;g.fillText('EMBER',0,6);g.restore();
  for(let i=0;i<55;i++){g.fillStyle=`rgba(255,255,255,${0.15+R()*0.4})`;g.beginPath();g.arc((R()-0.5)*cw*1.8,(R()-0.5)*ch*1.9,0.8+R()*2.2,0,Math.PI*2);g.fill();}
  g.fillStyle='rgba(255,255,255,0.35)';g.fillRect(-28,-ch+10,7,ch*2-20);
  g.restore();
  // sparks
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<90;i++){const a=R()*6.28,r=120+R()*260;g.fillStyle=`rgba(255,${120+R()*100|0},60,${0.3+R()*0.6})`;g.beginPath();g.arc(280+Math.cos(a)*r,390+Math.sin(a)*r*0.9,0.8+R()*2.4,0,6.28);g.fill();}
  g.restore();
  g.textAlign='center';g.textBaseline='middle';
  g.font='900 66px Cairo';g.letterSpacing='4px';g.fillStyle='#fff7f2';g.fillText('UNLEASH',280,72);
  g.fillStyle='#ff8a4c';g.shadowColor='#c4321f';g.shadowBlur=24;g.fillText('THE FIRE',280,138);g.shadowBlur=0;
  g.font='700 20px Cairo';g.letterSpacing='8px';g.fillStyle='rgba(255,247,242,0.75)';g.fillText('ENERGY THAT BURNS BRIGHT',280,662);
  g.fillStyle='#e85c3b';g.fillRect(230,632,100,3);
}
const tiny=document.createElement('canvas');const tctx=tiny.getContext('2d');

// ---------- timing ----------
const HITS=[[2.0,1.2],[3.0,.45],[3.5,.45],[4.0,.9],[7.0,.3],[11.0,.7],[12.5,.35],[13.0,.35],[13.5,.35],[14.0,.9],[17.0,.4],[19.5,.6],[22.0,.35],[22.5,.35],[26.0,1.2],[29.0,.9]];
const FLASH=[[2.0,.95],[4.0,.25],[11.0,.8],[14.0,.35],[19.5,.3],[26.0,.95],[29.0,.45]];
const WIPES=[3.0,7.0,12.5,17.0,22.0];
const hitAmp=t=>HITS.reduce((a,[h,s])=>t>=h?a+s*Math.exp(-(t-h)*9):a,0);

// ---------- global layers ----------
function drawBG(t,{grid=0.5,glow=1}={}){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  glowBlob(W*0.5+Math.sin(t*0.7)*320,H*0.58+Math.cos(t*0.5)*120,950,'rgba(196,50,31,0.32)',glow);
  glowBlob(W*0.18+Math.cos(t*0.4)*220,H*0.15,650,'rgba(232,92,59,0.14)',glow);
  glowBlob(W*0.85,H*0.9+Math.sin(t*0.6)*80,700,'rgba(120,20,10,0.25)',glow);
  if(grid>0){
    ctx.save();ctx.globalAlpha=grid*0.35;ctx.strokeStyle='rgba(232,92,59,0.5)';ctx.lineWidth=1.2;
    const hz=H*0.64,vx=W/2;
    for(let i=-22;i<=22;i++){ctx.beginPath();ctx.moveTo(vx+i*14,hz);ctx.lineTo(vx+i*260,H+40);ctx.stroke();}
    for(let k=0;k<14;k++){const z=((k+(t*1.6)%1))/14;const y=hz+(H-hz)*Math.pow(z,2.2);ctx.globalAlpha=grid*0.35*z;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const fade=ctx.createLinearGradient(0,hz-10,0,hz+160);fade.addColorStop(0,'rgba(10,10,10,1)');fade.addColorStop(1,'rgba(10,10,10,0)');ctx.globalAlpha=1;ctx.fillStyle=fade;ctx.fillRect(0,hz-10,W,170);
    ctx.restore();
  }
}
function drawEmbers(t,a=1){
  if(a<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of EMB){const y=((e.y-t*e.v)%H+H)%H;const x=e.x+Math.sin(t*0.8+e.ph)*e.dr;const tw_=0.4+0.6*Math.abs(Math.sin(t*2.2+e.ph*3));
    ctx.globalAlpha=a*tw_*0.7;ctx.fillStyle=e.s>2?'#ff8a4c':'#ffb070';ctx.beginPath();ctx.arc(x,y,e.s,0,6.28);ctx.fill();}
  ctx.restore();
}
function drawWipes(t){
  for(const w of WIPES){
    const a=P(t,w-0.32,w),b=P(t,w,w+0.32);
    if(a<=0||b>=1)continue;
    const lead=lerp(W+500,-500,eInOut(a)),trail=lerp(W+500,-500,eInOut(b));const sk=380;
    ctx.save();
    const g=ctx.createLinearGradient(trail,0,lead,H);g.addColorStop(0,'#5a0f07');g.addColorStop(0.5,C.red);g.addColorStop(1,C.ember);
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(lead+sk,0);ctx.lineTo(trail+sk+ (b>0?0:W*3),0);ctx.lineTo(trail-sk+(b>0?0:W*3),H);ctx.lineTo(lead-sk,H);ctx.closePath();ctx.fill();
    // hot edge
    ctx.strokeStyle='#ffd0b0';ctx.lineWidth=6;ctx.shadowColor=C.ember;ctx.shadowBlur=40;ctx.beginPath();ctx.moveTo(lead+sk,0);ctx.lineTo(lead-sk,H);ctx.stroke();
    if(b>0){ctx.beginPath();ctx.moveTo(trail+sk,0);ctx.lineTo(trail-sk,H);ctx.stroke();}
    // stripes inside
    ctx.globalAlpha=0.18;ctx.fillStyle='#000';for(let i=0;i<9;i++){const x=lerp(trail,lead,(i+0.5)/9);if(b<=0&&x>W+sk)continue;ctx.beginPath();ctx.moveTo(x+sk+12,0);ctx.lineTo(x+sk+30,0);ctx.lineTo(x-sk+30,H);ctx.lineTo(x-sk+12,H);ctx.fill();}
    ctx.restore();
  }
}
function drawPost(t,f){
  // flashes
  let fa=0;for(const[h,s]of FLASH){if(t>=h)fa+=s*Math.exp(-(t-h)*7);}
  if(fa>0.005){ctx.save();ctx.globalAlpha=clamp(fa);ctx.fillStyle='#fff3ea';ctx.fillRect(0,0,W,H);ctx.restore();}
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.72)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // scanlines subtle
  ctx.save();ctx.globalAlpha=0.05;ctx.fillStyle='#000';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);ctx.restore();
  // grain
  ctx.save();ctx.globalAlpha=0.07;ctx.globalCompositeOperation='overlay';const pat=ctx.createPattern(grains[f%6],'repeat');ctx.translate((f*37)%256,(f*91)%256);ctx.fillStyle=pat;ctx.fillRect(-256,-256,W+512,H+512);ctx.restore();
  // fade in/out
  const fo=P(t,0,0.15)*(1-P(t,29.72,30));if(fo<1){ctx.save();ctx.globalAlpha=1-fo;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.restore();}
}
function drawLogo(cx,cy,size,t,glowAmt=1){
  const pulse=0.5+0.5*Math.sin(t*2*Math.PI/2.4);
  const gs=size*(0.95+0.35*pulse)*1.25;
  glowBlob(cx,cy,gs,'rgba(232,92,59,0.75)',glowAmt*(0.45+0.45*pulse));
  glowBlob(cx,cy,gs*1.7,'rgba(196,50,31,0.35)',glowAmt);
  ctx.save();ctx.shadowColor='rgba(196,50,31,0.7)';ctx.shadowBlur=40;
  rr(cx-size/2,cy-size/2,size,size,size*0.2);ctx.clip();
  if(logo.complete)ctx.drawImage(logo,cx-size/2,cy-size/2,size,size);
  ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(196,50,31,0.55)';ctx.lineWidth=Math.max(2,size*0.012);rr(cx-size/2,cy-size/2,size,size,size*0.2);ctx.stroke();ctx.restore();
}
function sparkle(x,y,r,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#fff3e6';ctx.shadowColor=C.ember;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();ctx.restore();}
function pill(s,cx,cy,size,{fill='rgba(196,50,31,0.14)',stroke='rgba(232,92,59,0.55)',col=C.white,alpha=1,scale=1,w=700,padX=44,h=null}={}){
  if(alpha<=0||scale<=0)return 0;const tw_=tw(s,size,w);const pw=tw_+padX*2,ph=h||size*2.1;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(cx,cy);ctx.scale(scale,scale);
  rr(-pw/2,-ph/2,pw,ph,ph/2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();
  T(s,0,2,size,{w,col});ctx.restore();return pw;
}

// ---------- scenes ----------
function scene1(t){
  drawBG(t,{grid:0,glow:P(t,1.4,2.0)});
  const p=eIn(P(t,0,1.95));
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(t<2.0){
    for(const q of PARTS){
      const pos=pp=>{const r=q.r*(1-pp)+4;const a=q.a+q.spin*pp*2.2;return[W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*0.8]};
      const [x,y]=pos(p),[x0,y0]=pos(eIn(P(t-0.05,0,1.95)));
      ctx.globalAlpha=0.25+0.75*p;ctx.strokeStyle=q.c;ctx.lineWidth=q.s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();
    }
    glowBlob(W/2,H/2,40+340*Math.pow(p,3),'rgba(255,170,110,0.95)',p);
  }else{
    const b=eOutExpo(P(t,2.0,3.1));
    for(const q of PARTS){const r=q.r*1.3*b*(0.4+q.d);const a=q.a+q.spin*0.3;const x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r*0.8;
      ctx.globalAlpha=(1-P(t,2.0,3.0))*0.9;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(x,y,q.s*1.3,0,6.28);ctx.fill();}
    // rays
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*0.35);ctx.globalAlpha=0.07*(1-P(t,2.6,3.0));ctx.fillStyle='#ff9a6a';
    for(let i=0;i<14;i++){ctx.rotate(Math.PI*2/14);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1400,-90);ctx.lineTo(1400,90);ctx.fill();}ctx.restore();
    // shockwaves
    for(const k of[0,0.1,0.22]){const q=P(t,2.0+k,2.85+k);if(q<=0||q>=1)continue;ctx.globalAlpha=(1-q);ctx.strokeStyle=k?C.ember:'#ffe0cc';ctx.lineWidth=14*(1-q)+2;ctx.beginPath();ctx.ellipse(W/2,H/2,eOutExpo(q)*1250,eOutExpo(q)*1000,0,0,6.28);ctx.stroke();}
  }
  ctx.restore();
  if(t<1.95){
    const a=P(t,0.35,0.8)*(1-P(t,1.6,1.9));
    T('SABER GROUP  ·  2026',W/2,H*0.8-54,22,{w:700,ls:14,col:'rgba(255,200,170,0.7)',alpha:a});
    T('الجيل الجديد من المصممين',W/2,H*0.8,52,{w:700,alpha:a,glow:20});
  }
  if(t>=2.0){
    const s=eOutBack(P(t,2.0,2.42));const z=1+eIn(P(t,2.62,3.0))*9;
    ctx.save();ctx.globalAlpha=1-P(t,2.82,3.0);drawLogo(W/2,H/2-30,380*s*z,t,1.3);ctx.restore();
    T('GRAPHIC DESIGN × AI',W/2,H/2+230,30,{w:700,ls:20,col:C.gold,alpha:P(t,2.2,2.4)*(1-P(t,2.62,2.75))});
  }
}
function scene2(t){
  drawBG(t,{grid:0.35});
  // rotating dashed ring + stripes
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*0.4);ctx.setLineDash([4,22]);ctx.strokeStyle='rgba(232,92,59,0.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,440+hitAmp(t)*60,0,6.28);ctx.stroke();
